name: Release

# Builds the WebAssembly plugin. One .wasm file runs on every platform Pumpkin
# runs on. Push a tag like v0.1.0 to publish a GitHub release; run it manually
# to only get the file as a workflow artifact.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with the wasm32-wasip2 target
        run: |
          rustup update stable
          rustup default stable
          rustup target add wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Prepare artifact
        run: |
          PLUGIN_VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          PUMPKIN_TAG="$(tr -d '[:space:]' < PUMPKIN_VERSION)"
          NAME="fast-leaf-decay-${PLUGIN_VERSION}-pumpkin-${PUMPKIN_TAG}.wasm"
          mkdir -p dist
          cp target/wasm32-wasip2/release/fast_leaf_decay.wasm "dist/${NAME}"
          echo "ARTIFACT=${NAME}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: dist/${{ env.ARTIFACT }}
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PUMPKIN_TAG="$(tr -d '[:space:]' < PUMPKIN_VERSION)"
          cd dist
          sha256sum * > checksums.sha256
          cat > ../notes.md <<EOF
          Fast leaf decay for **Pumpkin ${PUMPKIN_TAG}**.

          One file for every platform: put \`${ARTIFACT}\` into your server's \`plugins/\` folder and restart.
          Works with the official Pumpkin release binaries from https://pumpkinmc.org/download/.
          EOF
          gh release create "$GITHUB_REF_NAME" * --title "fast-leaf-decay ${GITHUB_REF_NAME} for Pumpkin ${PUMPKIN_TAG}" --notes-file ../notes.md
