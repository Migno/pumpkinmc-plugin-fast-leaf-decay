[package]
name = "fast-leaf-decay"
version = "0.1.1"
edition = "2024"
description = "Leaves of a felled tree decay within about a second instead of minutes."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Migno/pumpkinmc-plugin-fast-leaf-decay"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The plugin SDK from the Pumpkin release this plugin targets (see PUMPKIN_VERSION).
# Wasm plugins talk to the server through the stable v0.1 WIT interface.
pumpkin-plugin-api = { git = "https://github.com/Pumpkin-MC/Pumpkin", tag = "0.2.2+26.3-26.60" }
tracing = "0.1"

[profile.release]
lto = true
opt-level = "s"
strip = true
codegen-units = 1
