<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a1f"/>
      <stop offset="1" stop-color="#0e1611"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" fill="url(#sky)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>

  <!-- ground -->
  <rect x="0" y="352" width="1280" height="48" fill="#2f4a24"/>
  <rect x="0" y="352" width="1280" height="8" fill="#4f7a34"/>

  <!-- stump with axe cut -->
  <g transform="translate(176 288)">
    <rect x="0" y="0" width="64" height="64" fill="#6b4a2b"/>
    <rect x="0" y="0" width="64" height="12" fill="#c49a62"/>
    <rect x="16" y="3" width="32" height="6" fill="#a87d4a"/>
    <rect x="8" y="20" width="8" height="40" fill="#5a3d22"/>
    <rect x="40" y="24" width="8" height="36" fill="#5a3d22"/>
  </g>

  <!-- leaf canopy breaking apart: blocks get smaller and fade as they fall -->
  <g fill="#4caf50">
    <rect x="112" y="64" width="40" height="40"/>
    <rect x="152" y="64" width="40" height="40" fill="#43a047"/>
    <rect x="192" y="64" width="40" height="40"/>
    <rect x="232" y="64" width="40" height="40" fill="#388e3c"/>
    <rect x="72" y="104" width="40" height="40" fill="#43a047"/>
    <rect x="112" y="104" width="40" height="40" fill="#388e3c"/>
    <rect x="192" y="104" width="40" height="40" fill="#43a047"/>
    <rect x="272" y="104" width="40" height="40"/>
    <rect x="152" y="144" width="40" height="40"/>
    <rect x="232" y="144" width="40" height="40" fill="#43a047"/>
  </g>
  <g fill="#66bb6a">
    <rect x="96" y="196" width="24" height="24" opacity="0.85"/>
    <rect x="216" y="200" width="24" height="24" opacity="0.85"/>
    <rect x="300" y="168" width="24" height="24" opacity="0.8"/>
    <rect x="140" y="236" width="16" height="16" opacity="0.65"/>
    <rect x="262" y="246" width="16" height="16" opacity="0.6"/>
    <rect x="60" y="250" width="16" height="16" opacity="0.55"/>
    <rect x="330" y="236" width="12" height="12" opacity="0.5"/>
    <rect x="112" y="290" width="10" height="10" opacity="0.4"/>
    <rect x="286" y="300" width="10" height="10" opacity="0.35"/>
    <rect x="250" y="324" width="8" height="8" opacity="0.3"/>
  </g>
  <!-- drops: sapling, stick, apple -->
  <g transform="translate(300 330)">
    <rect x="6" y="0" width="4" height="16" fill="#3e7d32"/>
    <rect x="0" y="2" width="6" height="6" fill="#66bb6a"/>
    <rect x="10" y="0" width="6" height="6" fill="#66bb6a"/>
  </g>
  <g transform="translate(70 336) rotate(-30)">
    <rect x="0" y="0" width="22" height="4" fill="#8d6e4a"/>
  </g>
  <g transform="translate(340 332)">
    <rect x="0" y="4" width="14" height="14" fill="#e53935"/>
    <rect x="6" y="0" width="3" height="5" fill="#5a3d22"/>
  </g>

  <!-- speed lines -->
  <g stroke="#ffb347" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round">
    <line x1="360" y1="120" x2="420" y2="120"/>
    <line x1="372" y1="146" x2="412" y2="146"/>
    <line x1="360" y1="172" x2="400" y2="172"/>
  </g>

  <!-- text -->
  <text x="470" y="150" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="6" fill="#9ccc65">PUMPKIN PLUGIN</text>
  <text x="466" y="232" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="92" font-weight="800" fill="url(#title)">Fast Leaf Decay</text>
  <text x="470" y="288" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="30" fill="#d7e4d0">Chop the trunk. The leaves are gone in a second.</text>
  <text x="470" y="330" font-family="Consolas, Menlo, monospace" font-size="20" fill="#7f9a78">native · Windows · Linux · macOS · vanilla loot · cancellable</text>
</svg>
