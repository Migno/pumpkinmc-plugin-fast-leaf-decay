<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a1f"/>
      <stop offset="1" stop-color="#0e1611"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="tile">
      <rect width="512" height="512" rx="96"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <rect width="512" height="512" fill="url(#grid)"/>

    <!-- ground -->
    <rect x="0" y="400" width="512" height="112" fill="#2f4a24"/>
    <rect x="0" y="400" width="512" height="12" fill="#4f7a34"/>

    <!-- stump with axe cut -->
    <g transform="translate(208 312)">
      <rect x="0" y="0" width="96" height="88" fill="#6b4a2b"/>
      <rect x="0" y="0" width="96" height="18" fill="#c49a62"/>
      <rect x="24" y="5" width="48" height="8" fill="#a87d4a"/>
      <rect x="12" y="30" width="12" height="52" fill="#5a3d22"/>
      <rect x="60" y="34" width="12" height="48" fill="#5a3d22"/>
    </g>

    <!-- canopy breaking apart -->
    <g fill="#4caf50">
      <rect x="160" y="64" width="64" height="64"/>
      <rect x="224" y="64" width="64" height="64" fill="#43a047"/>
      <rect x="288" y="64" width="64" height="64" fill="#388e3c"/>
      <rect x="96" y="128" width="64" height="64" fill="#43a047"/>
      <rect x="160" y="128" width="64" height="64" fill="#388e3c"/>
      <rect x="288" y="128" width="64" height="64"/>
      <rect x="352" y="128" width="64" height="64" fill="#43a047"/>
      <rect x="224" y="192" width="64" height="64"/>
    </g>

    <!-- falling leaves get smaller and fade -->
    <g fill="#66bb6a">
      <rect x="112" y="224" width="40" height="40" opacity="0.85"/>
      <rect x="364" y="220" width="40" height="40" opacity="0.85"/>
      <rect x="152" y="292" width="24" height="24" opacity="0.65"/>
      <rect x="344" y="296" width="24" height="24" opacity="0.6"/>
      <rect x="92" y="330" width="16" height="16" opacity="0.45"/>
      <rect x="406" y="338" width="16" height="16" opacity="0.4"/>
    </g>

    <!-- speed streaks -->
    <g stroke="#ffb347" stroke-opacity="0.55" stroke-width="8" stroke-linecap="round">
      <line x1="132" y1="196" x2="132" y2="212"/>
      <line x1="384" y1="192" x2="384" y2="208"/>
      <line x1="164" y1="264" x2="164" y2="280"/>
      <line x1="356" y1="268" x2="356" y2="284"/>
    </g>

    <!-- drops: sapling and apple -->
    <g transform="translate(150 368)">
      <rect x="12" y="0" width="8" height="32" fill="#3e7d32"/>
      <rect x="0" y="4" width="12" height="12" fill="#66bb6a"/>
      <rect x="20" y="0" width="12" height="12" fill="#66bb6a"/>
    </g>
    <g transform="translate(334 372)">
      <rect x="0" y="6" width="26" height="26" fill="#e53935"/>
      <rect x="11" y="0" width="5" height="9" fill="#5a3d22"/>
    </g>
  </g>
</svg>
